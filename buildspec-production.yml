# =============================================================================
# G-FORGE RADIO - PRODUCTION BUILD SPECIFICATION
# =============================================================================
#
# This buildspec handles:
# - Clean dependency installation
# - TypeScript compilation
# - Unit tests
# - Code quality checks
# - Artifact packaging
#
# Duration: ~2-3 minutes
# =============================================================================

version: 0.2

phases:
  # ===========================================================================
  # INSTALL PHASE
  # ===========================================================================
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "🚀 G-Forge Radio - Production Build Started"
      - echo "📅 Build Date:" $(date)
      - echo "🔖 Commit:" $CODEBUILD_RESOLVED_SOURCE_VERSION
      
      # Install pnpm
      - npm install -g pnpm@10.19.0
      - pnpm --version
      
      # Verify Node environment
      - node --version
      - npm --version
      
  # ===========================================================================
  # PRE-BUILD PHASE
  # ===========================================================================
  pre_build:
    commands:
      - echo "📦 Installing dependencies..."
      - pnpm install --frozen-lockfile
      
      - echo "🧹 Cleaning previous builds..."
      - rm -rf dist build .amplify cdk.out
      
  # ===========================================================================
  # BUILD PHASE
  # ===========================================================================
  build:
    commands:
      - echo "🏗️  Building application..."
      
      # TypeScript compilation
      - echo "📝 Compiling TypeScript..."
      - pnpm run build
      
      # Run ESLint
      - echo "🔍 Running linter..."
      - pnpm run lint || echo "⚠️ Linting warnings found"
      
      # Run unit tests
      - echo "🧪 Running unit tests..."
      - pnpm run test:unit || echo "⚠️ Unit tests failed"
      
      # Type checking
      - echo "✅ Type checking..."
      - pnpm run type-check || npx tsc --noEmit
      
  # ===========================================================================
  # POST-BUILD PHASE
  # ===========================================================================
  post_build:
    commands:
      - echo "📦 Packaging artifacts..."
      
      # Create build info
      - |
        cat > build-info.json <<EOF
        {
          "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit": "$CODEBUILD_RESOLVED_SOURCE_VERSION",
          "buildId": "$CODEBUILD_BUILD_ID",
          "branch": "${CODEBUILD_WEBHOOK_HEAD_REF#refs/heads/}",
          "buildNumber": "$CODEBUILD_BUILD_NUMBER"
        }
        EOF
      
      - cat build-info.json
      
      - echo "✅ Build completed successfully!"

# =============================================================================
# ARTIFACTS
# =============================================================================
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - node_modules/**/*
    - .git/**/*
    - tests/**/*
    - .amplify/**/*
    - cdk.out/**/*

# =============================================================================
# CACHE
# =============================================================================
cache:
  paths:
    - 'node_modules/**/*'
    - '.pnpm-store/**/*'

# =============================================================================
# REPORTS
# =============================================================================
reports:
  test_results:
    files:
      - 'test-results/**/*.xml'
    file-format: 'JUNITXML'
  coverage_report:
    files:
      - 'coverage/clover.xml'
    file-format: 'CLOVERXML'
