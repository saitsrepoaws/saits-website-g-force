server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name splashfm.nl www.splashfm.nl stream.splashfm.nl;
    
    root /var/www/splashfm;
    index index.html;
    
    # Homepage - SplashFM Player
    location = / {
        try_files /index.html =404;
    }
    
    # Proxy Icecast for stream and status
    location /stream.mp3 {
        proxy_pass http://localhost:8000/stream.mp3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
    
    location /status-json.xsl {
        proxy_pass http://localhost:8000/status-json.xsl;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    
    location /status.xsl {
        proxy_pass http://localhost:8000/status.xsl;
        proxy_set_header Host $host;
    }
    
    location /admin {
        proxy_pass http://localhost:8000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Static files
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
