type Playlist @model @auth(rules: [{allow: private}])
{
  name: String!
  description: String
  coverImageUrl: String
  genre: String
  mood: String
  bpmMin: Int
  bpmMax: Int
  key: String
  tags: String
  tracks: String @default(value: "[]")
  trackCount: Int @default(value: "0")
  totalDuration: Int @default(value: "0")
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type Schedule @model @auth(rules: [{allow: private}])
{
  name: String!
  dayOfWeek: Int @index(sortKeyFields: ["startTime"], queryField: "listScheduleByDayOfWeekAndStartTime")
  startTime: String!
  endTime: String
  startDate: String
  endDate: String
  playlistId: String!
  isActive: Boolean @default(value: "true")
  priority: Int @default(value: "0")
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type UserPreferences @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: private, operations: [read]}])
{
  userId: String! @primaryKey
  notificationsEnabled: Boolean @default(value: "true")
  notifyOnTrackChange: Boolean @default(value: "true")
  notifyOnPlaylistUpdate: Boolean @default(value: "true")
  notifyOnLogin: Boolean @default(value: "false")
  theme: String @default(value: "light")
  defaultView: String
  lastLoginAt: AWSDateTime
  lastLogoutAt: AWSDateTime
  loginCount: Int @default(value: "0")
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type PlayerState @model @auth(rules: [{allow: private}])
{
  playerId: String!
  currentTrackId: String
  currentTrackTitle: String
  currentTrackArtist: String
  currentPlaylistId: String
  status: String @default(value: "idle")
  lastPosition: Float @default(value: "0")
  duration: Float @default(value: "0")
  volume: Float @default(value: "0.7")
  autoPlayEnabled: Boolean @default(value: "false")
  currentScheduleSlotId: String
  currentScheduleSlotName: String
  lastActive: AWSDateTime
  lastUpdated: AWSDateTime
  deviceInfo: String
}

type StreamSettings @model @auth(rules: [{allow: private}])
{
  settingKey: String! @primaryKey
  playlistUpdateTriggerSeconds: Int @default(value: "60")
  playlistUpdateMinTrackDuration: Int @default(value: "60")
  playlistUpdateFallbackInterval: Int @default(value: "300")
  streamServerUrl: String
  streamMountPoint: String @default(value: "/stream.mp3")
  newsEnabled: Boolean @default(value: "false")
  crossfadeEnabled: Boolean @default(value: "true")
  crossfadeStartNext: Float @default(value: "3")
  crossfadeFadeIn: Float @default(value: "2")
  crossfadeFadeOut: Float @default(value: "2")
  crossfadeNormalize: Boolean @default(value: "true")
  smartCrossfadeEnabled: Boolean @default(value: "false")
  smartCrossfadeBpmTolerance: Int @default(value: "5")
  smartCrossfadeAutoAdjust: Boolean @default(value: "true")
  harmonicMixingEnabled: Boolean @default(value: "false")
  harmonicMixingStrict: Boolean @default(value: "false")
  harmonicMixingBoost: Float @default(value: "1")
  energyMatchingEnabled: Boolean @default(value: "false")
  energyMatchingTolerance: Float @default(value: "0.2")
  energyMatchingSmoothTransitions: Boolean @default(value: "true")
  crossfadeConservative: Boolean @default(value: "false")
  crossfadePreset: String @default(value: "techno")
  lastModifiedBy: String
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type StreamQueueTrack @model @auth(rules: [{allow: private}])
{
  trackId: String!
  artist: String
  title: String
  version: String
  trackDuration: Int
  playlistId: String
  playlistName: String
  position: Int
  queuedAt: AWSDateTime!
  status: String @default(value: "queued")
  completedAt: AWSDateTime
  ttl: Int
}

type TrackPlayHistory @model @auth(rules: [{allow: private}])
{
  trackId: String! @index(sortKeyFields: ["playedAt"], queryField: "listTrackPlayHistoryByTrackIdAndPlayedAt")
  artist: String
  title: String
  version: String
  playlistId: String
  playlistName: String
  playedAt: AWSDateTime!
  duration: Int
  source: String @default(value: "stream")
  listeners: Int
  skipped: Boolean @default(value: "false")
}

type StreamHealthLog @model @auth(rules: [{allow: private}])
{
  timestamp: String!
  icecastUp: Boolean!
  streamFlowing: Boolean!
  liquidsoakRunning: Boolean!
  trackCount: Int!
  bitrate: Int
  listenerCount: Int!
  currentTrack: String
  actionsTaken: String
  ttl: Int
}

type ListenerSession @model @auth(rules: [{allow: private}])
{
  sessionId: String!
  ipHash: String! @index(sortKeyFields: ["connectTime"], queryField: "listListenerSessionByIpHashAndConnectTime")
  userAgent: String
  device: String
  os: String
  player: String
  country: String
  city: String
  connectTime: AWSDateTime!
  disconnectTime: AWSDateTime
  duration: Int
  tracksHeard: String
  currentTrack: String
}

type ListenerProfile @model @auth(rules: [{allow: private}])
{
  ipHash: String!
  firstSeen: AWSDateTime!
  lastSeen: AWSDateTime!
  totalSessions: Int @default(value: "0")
  totalListenTime: Int @default(value: "0")
  favoriteHours: String
  returningListener: Boolean @default(value: "false")
  country: String
  city: String
  lastDevice: String
  lastOs: String
  lastPlayer: String
}

type Track @model @auth(rules: [{allow: private},
  {allow: public, provider: apiKey, operations: [read]}])
{
  artist: String
  title: String!
  version: String
  label: String
  genre: String
  tags: String
  year: Int
  duration: Int
  fileUrl: String
  fileSize: Int
  format: String
  addedAt: AWSDateTime
  bpm: Int
  key: String
  energy: Float
  danceability: Float
  valence: Float
  coverArtUrl: String
  waveformUrl: String
  peaks: String
  trimStart: Float
  trimEnd: Float
  playCount: Int @default(value: "0")
  lastPlayedAt: AWSDateTime
  totalListeners: Int @default(value: "0")
  averageListeners: Float
  skipCount: Int @default(value: "0")
  popularityScore: Float
}

type Query {
  generatePlaylist(name: String!, description: String, genre: String, mood: String, bpmMin: Int, bpmMax: Int, keys: [String], tags: String, maxTracks: Int, maxDuration: Int, includeJingles: Boolean, jinglesEveryN: Int, jingleGenre: String, jingleTags: String): AWSJSON @function(name: "FnGeneratePlaylist") @auth(rules: [{allow: private}])
}