<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash FM Radio - Live 24/7</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" as="image" href="/logosplashfmfm.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 25%, #4fc3f7 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        /* IoT Status Tag */
        .iot-status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .iot-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .iot-dot.offline {
            background: #f44336;
            box-shadow: 0 0 8px rgba(244, 67, 54, 0.6);
            animation: pulse-slow 2s ease-in-out infinite;
        }

        .iot-dot.connecting {
            background: #ff9800;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
            animation: pulse-medium 1.5s ease-in-out infinite;
        }

        .iot-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
            animation: pulse-fast 1s ease-in-out infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }

        @keyframes pulse-medium {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        @keyframes message-flash {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; box-shadow: 0 0 20px currentColor; }
            100% { transform: scale(1); opacity: 1; }
        }

        .iot-dot.flash {
            animation: message-flash 0.3s ease-out !important;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-img {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .station-name {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .tagline {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .now-playing {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 80px;
        }

        .now-playing-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .track-info {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .artist-info {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;
        }

        .pause-icon {
            display: none;
            width: 30px;
            height: 30px;
        }

        .pause-icon::before,
        .pause-icon::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 30px;
            background: white;
        }

        .pause-icon::before {
            left: 8px;
        }

        .pause-icon::after {
            right: 8px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }

        .status {
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .player-card {
                padding: 20px;
            }
            .iot-status-tag {
                font-size: 10px;
                padding: 4px 8px;
            }
            .iot-dot {
                width: 6px;
                height: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- IoT Status Tag -->
        <div class="iot-status-tag">
            <div class="iot-dot offline" id="iotDot"></div>
            <span id="iotText">Offline</span>
        </div>

        <!-- Player Card -->
        <div class="player-card">
            <div class="logo">
                <img src="/logosplashfmfm.png" alt="Splash FM Logo" class="logo-img">
            </div>

            <div class="station-name">Splash FM</div>
            <div class="tagline">🎵 Your 24/7 Music Stream</div>

            <div class="now-playing">
                <div class="now-playing-label">NOW PLAYING</div>
                <div class="track-info" id="track-title">Loading...</div>
                <div class="artist-info" id="track-artist"></div>
            </div>

            <div class="player-controls">
                <button class="play-button" id="playButton">
                    <div class="play-icon" id="playIcon"></div>
                    <div class="pause-icon" id="pauseIcon"></div>
                </button>
                
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
                </div>
            </div>

            <div class="status" id="status">Ready to play</div>

            <audio id="audioPlayer" preload="none">
                <source src="https://splashfm.nl/splashfm.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <!-- AWS Amplify via CDN (UMD bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/aws-amplify@6/dist/aws-amplify.min.js"></script>

    <script>
        console.log('🎛️ Stereo Tool Professional Audio Processing');
        console.log('🌐 CloudFront CDN: d4clnrcifbyms.cloudfront.net');
        console.log('⚡ HTTP/3 enabled for best performance');
        console.log('📡 IoT Core: Amplify PubSub (Real MQTT!)');

        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const status = document.getElementById('status');
        
        let isPlaying = false;
        let pubsubClient = null;
        let messageCount = 0;

        // ============================================
        // 📡 AWS IoT Configuration
        // ============================================
        const IOT_ENDPOINT = 'd08571201ngqyrl7gmlrx-ats.iot.eu-west-1.amazonaws.com';
        const IDENTITY_POOL_ID = 'eu-west-1:345056ed-fefd-4ab5-97c6-a7b5ec4073ea';
        const IOT_TOPIC = 'radio/stream/nowplaying';

        // ============================================
        // 🎨 IoT Status + Flash
        // ============================================
        function updateIoTStatus(state, text) {
            const dot = document.getElementById('iotDot');
            const textEl = document.getElementById('iotText');
            dot.classList.remove('offline', 'connecting', 'connected');
            dot.classList.add(state);
            textEl.textContent = text;
            console.log(`📡 IoT Status: ${state} - ${text}`);
        }

        function flashIoTDot() {
            const dot = document.getElementById('iotDot');
            dot.classList.add('flash');
            setTimeout(() => dot.classList.remove('flash'), 300);
        }

        // ============================================
        // 📡 Amplify PubSub IoT Connection
        // ============================================
        async function initializeIoT() {
            updateIoTStatus('connecting', 'Connecting...');
            
            try {
                // Configure Amplify
                const { Amplify } = window.aws_amplify.core;
                const { PubSub } = window.aws_amplify.pubsub;
                const { CONNECTION_STATE_CHANGE, AWSIoTProvider } = window.aws_amplify.pubsub;
                const { Hub } = window.aws_amplify.core.Hub;
                const { fetchAuthSession } = window.aws_amplify.auth;
                
                console.log('📦 Amplify loaded from CDN');
                
                // Configure Amplify with Cognito
                Amplify.configure({
                    Auth: {
                        Cognito: {
                            identityPoolId: IDENTITY_POOL_ID,
                            region: 'eu-west-1'
                        }
                    }
                });
                
                console.log('✅ Amplify configured');
                
                // Get auth session
                const session = await fetchAuthSession();
                const identityId = session.identityId;
                console.log('✅ Cognito credentials obtained');
                console.log('🔑 Identity ID:', identityId);
                
                // Attach IoT policy
                await attachIoTPolicy(identityId);
                
                // Configure PubSub
                const clientId = `splash-fm-player-${identityId.split(':')[1]}-${Date.now()}`;
                
                Amplify.addPluggableProvider(new AWSIoTProvider({
                    aws_pubsub_region: 'eu-west-1',
                    aws_pubsub_endpoint: `wss://${IOT_ENDPOINT}/mqtt`,
                    clientId: clientId
                }));
                
                console.log('📡 Client ID:', clientId);
                console.log('🔗 Endpoint: wss://' + IOT_ENDPOINT + '/mqtt');
                
                // Listen to connection state
                Hub.listen('pubsub', (data) => {
                    const { payload } = data;
                    if (payload.event === CONNECTION_STATE_CHANGE) {
                        const connectionState = payload.data.connectionState;
                        console.log('Connection state:', connectionState);
                        
                        if (connectionState === 'Connected') {
                            updateIoTStatus('connected', 'Connected');
                            console.log('✅ IoT CONNECTED!');
                        } else if (connectionState === 'Connecting') {
                            updateIoTStatus('connecting', 'Connecting...');
                        } else if (connectionState === 'Disconnected') {
                            updateIoTStatus('offline', 'Disconnected');
                        }
                    }
                });
                
                // Subscribe to topic
                console.log(`📩 Subscribing to: ${IOT_TOPIC}`);
                
                const subscription = PubSub.subscribe({ topics: [IOT_TOPIC] }).subscribe({
                    next: (data) => {
                        messageCount++;
                        console.log(`📥 Message ${messageCount} received!`);
                        console.log('📦 Payload:', data.value);
                        
                        // Flash effect!
                        flashIoTDot();
                        
                        try {
                            const trackData = data.value;
                            if (trackData.title) {
                                document.getElementById('track-title').textContent = trackData.title;
                            }
                            if (trackData.artist) {
                                document.getElementById('track-artist').textContent = trackData.artist;
                            }
                            console.log('🎵 Track updated:', trackData.artist, '-', trackData.title);
                        } catch (e) {
                            console.log('⚠️ Error parsing message:', e);
                        }
                    },
                    error: (error) => {
                        console.error('❌ Subscription error:', error);
                        updateIoTStatus('offline', 'Error');
                    }
                });
                
                console.log('✅ Subscribed to topic');
                
            } catch (error) {
                console.error('❌ IoT initialization failed:', error);
                updateIoTStatus('offline', 'Failed');
            }
        }

        async function attachIoTPolicy(identityId) {
            // Use AWS SDK v2 for policy attachment
            const script = document.createElement('script');
            script.src = 'https://sdk.amazonaws.com/js/aws-sdk-2.1691.0.min.js';
            document.head.appendChild(script);
            
            return new Promise((resolve) => {
                script.onload = () => {
                    AWS.config.region = 'eu-west-1';
                    AWS.config.credentials = new AWS.CognitoIdentityCredentials({
                        IdentityPoolId: IDENTITY_POOL_ID
                    });
                    
                    AWS.config.credentials.get((err) => {
                        if (err) {
                            console.error('Credentials error:', err);
                            resolve();
                            return;
                        }
                        
                        const iot = new AWS.Iot({ region: 'eu-west-1' });
                        iot.attachPolicy({
                            policyName: 'PublicPlayerPolicy',
                            target: identityId
                        }, (err) => {
                            if (err && err.code !== 'ResourceAlreadyExistsException') {
                                console.warn('⚠️ Policy attach warning:', err.message);
                            } else {
                                console.log('✅ IoT policy attached');
                            }
                            resolve();
                        });
                    });
                };
            });
        }

        // Play/Pause functionality
        playButton.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                status.textContent = 'Paused';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    status.textContent = '🎵 Now Streaming';
                    isPlaying = true;
                }).catch(err => {
                    status.textContent = '❌ Stream unavailable';
                    console.error('Playback failed:', err);
                });
            }
        });

        // Volume control
        volumeSlider.addEventListener('input', function() {
            audio.volume = this.value / 100;
        });
        audio.volume = 0.7;

        // ============================================
        // 🚀 Initialize
        // ============================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('📡 Initializing REAL IoT with Amplify...');
                initializeIoT();
            }, 1000);
        });
    </script>
</body>
</html>
