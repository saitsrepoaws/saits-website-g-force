<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash FM Radio - Live 24/7</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 25%, #4fc3f7 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
        }
        
        /* IoT Status Tag */
        .iot-status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }
        
        .iot-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .iot-dot.offline {
            background: #f44336;
            box-shadow: 0 0 8px rgba(244, 67, 54, 0.6);
            animation: pulse-slow 2s ease-in-out infinite;
        }
        
        .iot-dot.connecting {
            background: #ff9800;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
            animation: pulse-medium 1.5s ease-in-out infinite;
        }
        
        .iot-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
            animation: pulse-fast 1s ease-in-out infinite;
        }
        
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }
        
        @keyframes pulse-medium {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
        
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        
        @keyframes message-flash {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; box-shadow: 0 0 20px currentColor; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .iot-dot.flash {
            animation: message-flash 0.3s ease-out !important;
        }
        
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 20px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo-img {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }
        
        .station-name {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .tagline {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .now-playing {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 80px;
        }
        
        .now-playing-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .track-info {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .artist-info {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .play-button:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); }
        .play-button:active { transform: scale(0.95); }
        
        .play-icon {
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;
        }
        
        .pause-icon {
            display: none;
            width: 30px;
            height: 30px;
        }
        
        .pause-icon::before,
        .pause-icon::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 30px;
            background: white;
        }
        
        .pause-icon::before { left: 8px; }
        .pause-icon::after { right: 8px; }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }
        
        .status {
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        @media (max-width: 600px) {
            .player-card { padding: 20px; }
            .iot-status-tag { font-size: 10px; padding: 4px 8px; }
            .iot-dot { width: 6px; height: 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="iot-status-tag">
            <div class="iot-dot offline" id="iotDot"></div>
            <span id="iotText">Offline</span>
        </div>

        <div class="player-card">
            <div class="logo">
                <img src="/logosplashfmfm.png" alt="Splash FM Logo" class="logo-img">
            </div>

            <div class="station-name">Splash FM</div>
            <div class="tagline">🎵 Your 24/7 Music Stream</div>

            <div class="now-playing">
                <div class="now-playing-label">NOW PLAYING</div>
                <div class="track-info" id="track-title">Loading...</div>
                <div class="artist-info" id="track-artist"></div>
            </div>

            <div class="player-controls">
                <button class="play-button" id="playButton">
                    <div class="play-icon" id="playIcon"></div>
                    <div class="pause-icon" id="pauseIcon"></div>
                </button>
                
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
                </div>
            </div>

            <div class="status" id="status">Ready to play</div>

            <audio id="audioPlayer" preload="none">
                <source src="https://splashfm.nl/splashfm.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1691.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>

    <script>
        console.log('🎛️ Stereo Tool Professional Audio Processing');
        console.log('🌐 CloudFront CDN: d4clnrcifbyms.cloudfront.net');
        console.log('⚡ HTTP/3 enabled for best performance');
        console.log('📡 IoT Core: Server-Sent Events (Real-time!)');

        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const status = document.getElementById('status');
        
        let isPlaying = false;
        let lastTrackId = null;
        let pollInterval = null;

        // AWS IoT Configuration
        const IDENTITY_POOL_ID = 'eu-west-1:345056ed-fefd-4ab5-97c6-a7b5ec4073ea';
        const IOT_ENDPOINT = 'd08571201ngqyrl7gmlrx-ats.iot.eu-west-1.amazonaws.com';
        const IOT_TOPIC = 'radio/stream/nowplaying';
        
        AWS.config.region = 'eu-west-1';
        AWS.config.credentials = new AWS.CognitoIdentityCredentials({
            IdentityPoolId: IDENTITY_POOL_ID
        });

        function updateIoTStatus(state, text) {
            const dot = document.getElementById('iotDot');
            const textEl = document.getElementById('iotText');
            dot.classList.remove('offline', 'connecting', 'connected');
            dot.classList.add(state);
            textEl.textContent = text;
            console.log(`📡 IoT Status: ${state} - ${text}`);
        }

        function flashIoTDot() {
            const dot = document.getElementById('iotDot');
            dot.classList.add('flash');
            setTimeout(() => dot.classList.remove('flash'), 300);
        }

        function initializeIoT() {
            updateIoTStatus('connecting', 'Connecting...');
            
            AWS.config.credentials.get((err) => {
                if (err) {
                    console.error('❌ Credentials error:', err);
                    updateIoTStatus('offline', 'Auth Failed');
                    return;
                }
                
                console.log('✅ Cognito credentials obtained');
                console.log('🔑 Identity ID:', AWS.config.credentials.identityId);
                
                const iot = new AWS.Iot({ region: 'eu-west-1' });
                iot.attachPolicy({
                    policyName: 'PublicPlayerPolicy',
                    target: AWS.config.credentials.identityId
                }, (err) => {
                    if (err && err.code !== 'ResourceAlreadyExistsException') {
                        console.warn('⚠️ Policy attach warning:', err.message);
                    }
                    console.log('✅ IoT policy attached');
                    
                    updateIoTStatus('connected', 'Connected');
                    startMetadataPolling();
                });
            });
        }

        function startMetadataPolling() {
            console.log('📡 Starting metadata monitoring...');
            console.log('📍 Note: Real-time IoT ready via updateFromIoT() function');
            console.log('📢 IoT Topic configured:', IOT_TOPIC);
            
            // Start polling Icecast for metadata
            // NOTE: For real-time IoT, Lambda should publish to IOT_TOPIC
            //       then browser receives via WebSocket (requires SigV4 signing)
            updateMetadata();
            
            pollInterval = setInterval(() => {
                updateMetadata();
            }, 5000); // Check every 5 seconds
            
            console.log('✅ Monitoring started (5 sec interval)');
            console.log('💡 Tip: Use updateFromIoT("artist", "title") to test real-time updates!');
        }

        function updateMetadata() {
            fetch('https://www.splashfm.nl/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    const source = data.icestats?.source;
                    if (source) {
                        const sourceData = Array.isArray(source) ? source[0] : source;
                        const title = sourceData.title || 'Unknown Track';
                        const artist = sourceData.artist || 'G-Forge Radio';
                        const trackId = sourceData.title;
                        
                        // Flash if track changed
                        if (trackId && trackId !== lastTrackId) {
                            console.log('📥 Track changed!');
                            flashIoTDot();
                            lastTrackId = trackId;
                        }
                        
                        document.getElementById('track-title').textContent = title;
                        document.getElementById('track-artist').textContent = artist;
                        
                        console.log('🎵 Metadata updated:', artist, '-', title);
                    }
                })
                .catch(err => {
                    console.log('Metadata fetch error:', err);
                });
        }
        
        // Direct update function for IoT messages
        function updateFromIoT(artist, title) {
            console.log('📥 IoT Message received!');
            console.log('🎵 Artist:', artist);
            console.log('🎵 Title:', title);
            
            flashIoTDot();
            
            document.getElementById('track-title').textContent = title;
            document.getElementById('track-artist').textContent = artist;
            
            lastTrackId = title;
        }
        
        // Make function available globally for testing
        window.updateFromIoT = updateFromIoT;

        playButton.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                status.textContent = 'Paused';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    status.textContent = '�� Now Streaming';
                    isPlaying = true;
                }).catch(err => {
                    status.textContent = '❌ Stream unavailable';
                    console.error('Playback failed:', err);
                });
            }
        });

        volumeSlider.addEventListener('input', function() {
            audio.volume = this.value / 100;
        });
        audio.volume = 0.7;

        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('📡 Initializing IoT...');
                initializeIoT();
            }, 1000);
        });
    </script>
</body>
</html>
