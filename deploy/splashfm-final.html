<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash FM Radio - Live 24/7</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- ⚡ PERFORMANCE OPTIMIZATION ⚡ -->
    <link rel="preconnect" href="https://splashfm.nl">
    <link rel="dns-prefetch" href="https://splashfm.nl">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 25%, #4fc3f7 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
        }
        
        /* IoT Status Tag */
        .iot-status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .iot-status-tag:hover {
            transform: scale(1.05);
        }
        
        .iot-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .iot-dot.offline {
            background: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.8), 0 0 20px rgba(244, 67, 54, 0.4);
            animation: pulse-red 2s ease-in-out infinite;
        }
        
        .iot-dot.connecting {
            background: #ff9800;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.8), 0 0 20px rgba(255, 152, 0, 0.4);
            animation: pulse-orange 1.5s ease-in-out infinite;
        }
        
        .iot-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.8), 0 0 20px rgba(76, 175, 80, 0.4);
            animation: pulse-green 2s ease-in-out infinite;
        }
        
        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
        }
        
        @keyframes pulse-orange {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        @keyframes pulse-green {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
        
        @keyframes message-flash {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.6; box-shadow: 0 0 30px currentColor; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .iot-dot.flash {
            animation: message-flash 0.4s ease-out !important;
        }
        
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 20px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo-img {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }
        
        .station-name {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .tagline {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .now-playing {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 80px;
        }
        
        .now-playing-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .track-info {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .artist-info {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        /* 🎵 IMPROVED PLAY BUTTON 🎵 */
        .play-button {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            border: 4px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 8px 20px rgba(255, 107, 53, 0.4),
                0 4px 10px rgba(0, 0, 0, 0.3),
                inset 0 -2px 10px rgba(0, 0, 0, 0.2),
                inset 0 2px 10px rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        
        .play-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .play-button:hover::before {
            opacity: 1;
        }
        
        .play-button:hover {
            transform: scale(1.15);
            box-shadow: 
                0 12px 30px rgba(255, 107, 53, 0.6),
                0 6px 15px rgba(0, 0, 0, 0.4),
                inset 0 -2px 10px rgba(0, 0, 0, 0.2),
                inset 0 2px 10px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .play-button:active {
            transform: scale(0.95);
            transition: all 0.1s ease;
        }
        
        /* Playing state animation */
        .play-button.playing {
            animation: play-pulse 2s ease-in-out infinite;
            box-shadow: 
                0 0 0 0 rgba(255, 107, 53, 0.7),
                0 0 0 10px rgba(255, 107, 53, 0.4),
                0 0 0 20px rgba(255, 107, 53, 0.2),
                0 8px 20px rgba(255, 107, 53, 0.5);
        }
        
        @keyframes play-pulse {
            0% {
                box-shadow: 
                    0 0 0 0 rgba(255, 107, 53, 0.7),
                    0 0 0 10px rgba(255, 107, 53, 0.4),
                    0 0 0 20px rgba(255, 107, 53, 0.2),
                    0 8px 20px rgba(255, 107, 53, 0.5);
            }
            50% {
                box-shadow: 
                    0 0 0 10px rgba(255, 107, 53, 0.5),
                    0 0 0 20px rgba(255, 107, 53, 0.3),
                    0 0 0 30px rgba(255, 107, 53, 0.1),
                    0 12px 30px rgba(255, 107, 53, 0.6);
            }
            100% {
                box-shadow: 
                    0 0 0 0 rgba(255, 107, 53, 0.7),
                    0 0 0 10px rgba(255, 107, 53, 0.4),
                    0 0 0 20px rgba(255, 107, 53, 0.2),
                    0 8px 20px rgba(255, 107, 53, 0.5);
            }
        }
        
        /* Ripple effect on click */
        .play-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        
        .play-button.ripple::after {
            animation: ripple 0.6s ease-out;
        }
        
        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }
        
        /* Play icon - Triangle */
        .play-icon {
            width: 0;
            height: 0;
            border-left: 30px solid white;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            margin-left: 6px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        
        /* Pause icon - Two bars */
        .pause-icon {
            display: none;
            position: relative;
            width: 40px;
            height: 40px;
        }
        
        .pause-icon::before,
        .pause-icon::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 40px;
            background: white;
            border-radius: 3px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        
        .pause-icon::before { left: 6px; }
        .pause-icon::after { right: 6px; }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .volume-slider:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .status {
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .status.loading {
            animation: status-pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes status-pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; background: rgba(255, 107, 53, 0.2); }
        }
        
        @media (max-width: 600px) {
            .player-card { padding: 20px; }
            .play-button { width: 80px; height: 80px; }
            .play-icon { border-left: 24px solid white; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
            .iot-status-tag { font-size: 10px; padding: 4px 8px; }
            .iot-dot { width: 8px; height: 8px; }
        }
    </style>
</head>
<body>
    <!-- IoT Status Tag -->
    <div class="iot-status-tag">
        <div class="iot-dot offline" id="iotDot"></div>
        <span id="iotText">IoT: Offline</span>
    </div>

    <div class="container">
        <div class="player-card">
            <div class="logo">
                <img src="/logosplashfmfm.png" alt="Splash FM Logo" class="logo-img">
            </div>
            
            <div class="tagline">🌊 24/7 House Music Stream 🎵</div>
            
            <div class="now-playing">
                <div class="now-playing-label">♪ Now Playing:</div>
                <div class="track-info" id="trackInfo">Loading...</div>
                <div class="artist-info" id="artistInfo"></div>
            </div>
            
            <div class="player-controls">
                <button class="play-button" id="playButton" aria-label="Play/Pause">
                    <div class="play-icon" id="playIcon"></div>
                    <div class="pause-icon" id="pauseIcon"></div>
                </button>
                
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
                </div>
            </div>

            <div class="status" id="status">Ready to play ⚡</div>

            <!-- ⚡ OPTIMIZED AUDIO ELEMENT ⚡ -->
            <audio id="audioPlayer" preload="auto" crossorigin="anonymous">
                <source src="https://splashfm.nl/splashfm.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <!-- AWS SDK v3 for IoT (modular, smaller!) -->
    <script type="module">
        console.log('📡 Real-time IoT MQTT Subscription Active!');
        console.log('⚡ Using AWS SDK v3 (lightweight!)');
        
        // Import from CDN (using importmap would be better but this works!)
        const { CognitoIdentityClient } = await import('https://cdn.jsdelivr.net/npm/@aws-sdk/client-cognito-identity@3/+esm');
        const { fromCognitoIdentityPool } = await import('https://cdn.jsdelivr.net/npm/@aws-sdk/credential-providers@3/+esm');
        const { mqtt, iot } = await import('https://cdn.jsdelivr.net/npm/aws-iot-device-sdk-v2@1/+esm');
        
        // Configuration
        const IOT_ENDPOINT = 'd08571201ngqyrl7gmlrx-ats.iot.eu-west-1.amazonaws.com';
        const IDENTITY_POOL_ID = 'eu-west-1:345056ed-fefd-4ab5-97c6-a7b5ec4073ea';
        const IOT_TOPIC = 'radio/stream/nowplaying';
        const REGION = 'eu-west-1';
        
        let mqttConnection = null;
        
        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const status = document.getElementById('status');
        
        let isPlaying = false;

        function updateIoTStatus(state, text) {
            const iotDot = document.getElementById('iotDot');
            const iotText = document.getElementById('iotText');
            
            iotDot.className = 'iot-dot ' + state;
            iotText.textContent = text;
            
            console.log('📡 IoT Status:', state, '-', text);
        }

        function flashIoTDot() {
            const iotDot = document.getElementById('iotDot');
            iotDot.classList.add('flash');
            setTimeout(() => iotDot.classList.remove('flash'), 400);
        }

        // REAL MQTT SUBSCRIPTION! 🔥
        async function connectToIoT() {
            try {
                updateIoTStatus('connecting', 'IoT: Connecting...');
                console.log('🔐 Getting Cognito credentials...');
                
                // Get credentials
                const credentials = fromCognitoIdentityPool({
                    identityPoolId: IDENTITY_POOL_ID,
                    clientConfig: { region: REGION }
                });
                
                const creds = await credentials();
                console.log('✅ Credentials obtained!');
                
                // Create MQTT connection
                console.log('🔌 Creating MQTT connection...');
                
                const config = iot.AwsIotMqttConnectionConfigBuilder.new_with_websockets()
                    .with_clean_session(true)
                    .with_client_id(`splash-player-${Date.now()}`)
                    .with_endpoint(IOT_ENDPOINT)
                    .with_credentials(
                        REGION,
                        creds.accessKeyId,
                        creds.secretAccessKey,
                        creds.sessionToken
                    )
                    .build();
                
                const client = new mqtt.MqttClient();
                mqttConnection = client.new_connection(config);
                
                // Connection events
                mqttConnection.on('connect', () => {
                    console.log('✅ MQTT Connected!');
                    updateIoTStatus('connected', 'IoT: Connected');
                    
                    // Subscribe to topic
                    console.log('📡 Subscribing to:', IOT_TOPIC);
                    mqttConnection.subscribe(
                        IOT_TOPIC,
                        mqtt.QoS.AtLeastOnce,
                        (topic, payload) => {
                            try {
                                const message = JSON.parse(new TextDecoder().decode(payload));
                                console.log('🔥 IoT Message received!', message);
                                
                                flashIoTDot();
                                
                                if (message.artist && message.title) {
                                    document.getElementById('artistInfo').textContent = message.artist;
                                    document.getElementById('trackInfo').textContent = message.title;
                                }
                            } catch (error) {
                                console.error('❌ Error parsing message:', error);
                            }
                        }
                    ).then(() => {
                        console.log('✅ Subscribed to:', IOT_TOPIC);
                        console.log('📥 Waiting for real-time updates...');
                    });
                });
                
                mqttConnection.on('disconnect', () => {
                    console.log('⚠️ MQTT Disconnected');
                    updateIoTStatus('connecting', 'IoT: Reconnecting...');
                });
                
                mqttConnection.on('error', (error) => {
                    console.error('❌ MQTT Error:', error);
                    updateIoTStatus('offline', 'IoT: Error');
                });
                
                // Connect!
                await mqttConnection.connect();
                
            } catch (error) {
                console.error('❌ IoT connection failed:', error);
                updateIoTStatus('offline', 'IoT: Failed');
                
                // Fallback to polling
                console.log('⚠️ Falling back to polling...');
                startMetadataPolling();
            }
        }

        // Fallback polling
        let pollInterval = null;
        
        function startMetadataPolling() {
            console.log('📡 Starting fallback metadata polling...');
            
            updateMetadata();
            
            pollInterval = setInterval(() => {
                updateMetadata();
            }, 5000);
        }

        async function updateMetadata() {
            try {
                const response = await fetch('https://www.splashfm.nl/status-json.xsl');
                const data = await response.json();
                
                const source = Array.isArray(data.icestats.source) 
                    ? data.icestats.source[0] 
                    : data.icestats.source;
                
                if (source && source.title) {
                    const parts = source.title.split(' - ');
                    const artist = parts.length > 1 ? parts[0] : 'Splash FM';
                    const title = parts.length > 1 ? parts.slice(1).join(' - ') : source.title;
                    
                    document.getElementById('artistInfo').textContent = artist;
                    document.getElementById('trackInfo').textContent = title;
                }
            } catch (error) {
                console.log('⚠️ Metadata update failed:', error.message);
            }
        }

        // Start IoT connection
        connectToIoT();

        // Play button
        playButton.addEventListener('click', async () => {
            playButton.classList.add('ripple');
            setTimeout(() => playButton.classList.remove('ripple'), 600);
            
            if (!isPlaying) {
                console.log('⚡ Starting playback...');
                status.textContent = 'Starting... ⚡';
                status.classList.add('loading');
                
                try {
                    const startTime = performance.now();
                    await audio.play();
                    const loadTime = (performance.now() - startTime).toFixed(0);
                    
                    console.log(`✅ Started in ${loadTime}ms!`);
                    
                    isPlaying = true;
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    playButton.classList.add('playing');
                    status.textContent = `🎵 Playing (${loadTime}ms start)`;
                    status.classList.remove('loading');
                    
                    if (!pollInterval && !mqttConnection) startMetadataPolling();
                    
                } catch (error) {
                    status.textContent = '❌ Failed to start stream';
                    status.classList.remove('loading');
                    console.error('Playback error:', error);
                }
            } else {
                audio.pause();
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playButton.classList.remove('playing');
                status.textContent = 'Paused';
                status.classList.remove('loading');
            }
        });

        // Volume control
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });
        audio.volume = 0.7;

        // Audio events
        audio.addEventListener('waiting', () => {
            status.textContent = 'Buffering...';
            status.classList.add('loading');
        });
        
        audio.addEventListener('playing', () => {
            status.textContent = '🎵 Live Stream Playing';
            status.classList.remove('loading');
        });
        
        audio.addEventListener('pause', () => {
            if (!isPlaying) {
                status.textContent = 'Paused';
            }
        });
        
        audio.addEventListener('error', (e) => {
            status.textContent = '❌ Stream error';
            status.classList.remove('loading');
            console.error('Audio error:', e);
        });

        // Preload monitoring
        audio.addEventListener('loadstart', () => {
            console.log('⚡ Stream preload started...');
        });
        
        audio.addEventListener('canplay', () => {
            console.log('✅ Stream ready to play!');
            status.textContent = 'Ready to play ⚡';
        });

        console.log('✅ Player initialized with REAL-TIME IoT! 🚀');
    </script>
</body>
</html>
