<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash FM Radio - Live 24/7</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" as="image" href="/logosplashfmfm.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 25%, #4fc3f7 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        /* IoT Status Tag - Small & Top Right */
        .iot-status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .iot-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        /* Status Colors */
        .iot-dot.offline {
            background: #f44336;
            box-shadow: 0 0 8px rgba(244, 67, 54, 0.6);
            animation: pulse-slow 2s ease-in-out infinite;
        }

        .iot-dot.connecting {
            background: #ff9800;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
            animation: pulse-medium 1.5s ease-in-out infinite;
        }

        .iot-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
            animation: pulse-fast 1s ease-in-out infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }

        @keyframes pulse-medium {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        /* Flash effect on message activity */
        @keyframes message-flash {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; box-shadow: 0 0 20px currentColor; }
            100% { transform: scale(1); opacity: 1; }
        }

        .iot-dot.flash {
            animation: message-flash 0.3s ease-out !important;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-img {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .station-name {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .tagline {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .now-playing {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 80px;
        }

        .now-playing-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .track-info {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .artist-info {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;
        }

        .pause-icon {
            display: none;
            width: 30px;
            height: 30px;
        }

        .pause-icon::before,
        .pause-icon::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 30px;
            background: white;
        }

        .pause-icon::before {
            left: 8px;
        }

        .pause-icon::after {
            right: 8px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }

        .status {
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .player-card {
                padding: 20px;
            }

            .iot-status-tag {
                font-size: 10px;
                padding: 4px 8px;
            }

            .iot-dot {
                width: 6px;
                height: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- IoT Status Tag (Small, Top Right) -->
        <div class="iot-status-tag">
            <div class="iot-dot offline" id="iotDot"></div>
            <span id="iotText">Offline</span>
        </div>

        <!-- Player Card -->
        <div class="player-card">
            <div class="logo">
                <img src="/logosplashfmfm.png" alt="Splash FM Logo" class="logo-img">
            </div>

            <div class="station-name">Splash FM</div>
            <div class="tagline">🎵 Your 24/7 Music Stream</div>

            <div class="now-playing">
                <div class="now-playing-label">NOW PLAYING</div>
                <div class="track-info" id="track-title">Loading...</div>
                <div class="artist-info" id="track-artist"></div>
            </div>

            <div class="player-controls">
                <button class="play-button" id="playButton">
                    <div class="play-icon" id="playIcon"></div>
                    <div class="pause-icon" id="pauseIcon"></div>
                </button>
                
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
                </div>
            </div>

            <div class="status" id="status">Ready to play</div>

            <audio id="audioPlayer" preload="none">
                <source src="https://splashfm.nl/splashfm.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <!-- AWS SDK via CDN -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1691.0.min.js"></script>
    <!-- Paho MQTT via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>

    <script>
        console.log('🎛️ Stereo Tool Professional Audio Processing');
        console.log('🌐 CloudFront CDN: d4clnrcifbyms.cloudfront.net');
        console.log('⚡ HTTP/3 enabled for best performance');
        console.log('📡 IoT Core: Real MQTT Connection (Paho + SigV4)');

        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const status = document.getElementById('status');
        
        let isPlaying = false;

        // ============================================
        // 📡 AWS IoT Configuration
        // ============================================
        const AWS_REGION = 'eu-west-1';
        const IOT_ENDPOINT = 'd08571201ngqyrl7gmlrx-ats.iot.eu-west-1.amazonaws.com';
        const IDENTITY_POOL_ID = 'eu-west-1:345056ed-fefd-4ab5-97c6-a7b5ec4073ea';
        const IOT_TOPIC = 'radio/stream/nowplaying';

        // Configure AWS SDK
        AWS.config.region = AWS_REGION;
        AWS.config.credentials = new AWS.CognitoIdentityCredentials({
            IdentityPoolId: IDENTITY_POOL_ID
        });

        // ============================================
        // 🎨 IoT Status Update Function
        // ============================================
        function updateIoTStatus(state, text) {
            const dot = document.getElementById('iotDot');
            const textEl = document.getElementById('iotText');
            
            // Remove all status classes
            dot.classList.remove('offline', 'connecting', 'connected');
            
            // Add new status class
            dot.classList.add(state);
            
            // Update text
            textEl.textContent = text;
            
            console.log(`📡 IoT Status: ${state} - ${text}`);
        }

        // ============================================
        // 💫 Flash Effect on Message Activity
        // ============================================
        function flashIoTDot() {
            const dot = document.getElementById('iotDot');
            dot.classList.add('flash');
            setTimeout(() => {
                dot.classList.remove('flash');
            }, 300);
        }

        // ============================================
        // 📡 REAL MQTT Connection with Paho
        // ============================================
        let mqttClient = null;
        let messageCount = 0;

        function initializeIoT() {
            updateIoTStatus('connecting', 'Connecting...');
            
            // Get credentials
            AWS.config.credentials.get((err) => {
                if (err) {
                    console.error('❌ Failed to get credentials:', err);
                    updateIoTStatus('offline', 'Auth Failed');
                    return;
                }
                
                console.log('✅ Cognito credentials obtained');
                console.log('🔑 Identity ID:', AWS.config.credentials.identityId);
                
                // Attach IoT policy then connect
                attachIoTPolicy();
            });
        }

        function attachIoTPolicy() {
            const iot = new AWS.Iot({ region: AWS_REGION });
            const policyName = 'PublicPlayerPolicy';
            const target = AWS.config.credentials.identityId;
            
            iot.attachPolicy({
                policyName: policyName,
                target: target
            }, (err, data) => {
                if (err && err.code !== 'ResourceAlreadyExistsException') {
                    console.warn('⚠️ Policy attach warning:', err.message);
                }
                
                console.log('✅ IoT policy attached (or already exists)');
                
                // Connect to REAL MQTT
                connectRealMQTT();
            });
        }

        function connectRealMQTT() {
            console.log('🔌 Connecting to REAL MQTT over WebSocket...');
            
            try {
                // Get SigV4 signed WebSocket URL
                const endpoint = `wss://${IOT_ENDPOINT}/mqtt`;
                const clientId = 'splash-fm-player-' + Math.random().toString(36).substring(7);
                
                console.log('📡 Client ID:', clientId);
                console.log('🔗 Endpoint:', endpoint);
                
                // Create Paho MQTT client
                mqttClient = new Paho.Client(IOT_ENDPOINT, 443, '/mqtt', clientId);
                
                // Set callbacks
                mqttClient.onConnectionLost = onConnectionLost;
                mqttClient.onMessageArrived = onMessageArrived;
                
                // Connect options with WebSocket
                const connectOptions = {
                    useSSL: true,
                    timeout: 10,
                    mqttVersion: 4,
                    onSuccess: onConnect,
                    onFailure: onFailure,
                    // AWS IoT requires these
                    userName: '?SDK=JavaScript&Version=1.0.0',
                    password: getSignedUrl()
                };
                
                console.log('🔐 Connecting with SigV4 authentication...');
                mqttClient.connect(connectOptions);
                
            } catch (error) {
                console.error('❌ MQTT connection failed:', error);
                updateIoTStatus('offline', 'Connection Failed');
            }
        }

        function getSignedUrl() {
            // Get AWS credentials
            const accessKeyId = AWS.config.credentials.accessKeyId;
            const secretAccessKey = AWS.config.credentials.secretAccessKey;
            const sessionToken = AWS.config.credentials.sessionToken;
            
            // For AWS IoT WebSocket, we use the session token as password
            return sessionToken || '';
        }

        function onConnect() {
            console.log('✅ MQTT CONNECTED!');
            updateIoTStatus('connected', 'Connected');
            
            // Subscribe to topic
            console.log(`📩 Subscribing to: ${IOT_TOPIC}`);
            mqttClient.subscribe(IOT_TOPIC);
            console.log('✅ Subscribed to topic');
        }

        function onFailure(error) {
            console.error('❌ MQTT connection failed:', error);
            updateIoTStatus('offline', 'Failed');
            
            // Retry in 5 seconds
            setTimeout(() => {
                console.log('🔄 Retrying connection...');
                initializeIoT();
            }, 5000);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log('⚠️ Connection lost:', responseObject.errorMessage);
                updateIoTStatus('offline', 'Disconnected');
                
                // Retry
                setTimeout(() => {
                    console.log('🔄 Reconnecting...');
                    initializeIoT();
                }, 5000);
            }
        }

        function onMessageArrived(message) {
            messageCount++;
            console.log(`📥 Message ${messageCount} received!`);
            console.log('📦 Payload:', message.payloadString);
            
            // Flash effect!
            flashIoTDot();
            
            try {
                const data = JSON.parse(message.payloadString);
                
                // Update track info
                if (data.title) {
                    document.getElementById('track-title').textContent = data.title;
                }
                if (data.artist) {
                    document.getElementById('track-artist').textContent = data.artist;
                }
                
                console.log('🎵 Track updated:', data.artist, '-', data.title);
            } catch (e) {
                console.log('⚠️ Could not parse message as JSON');
            }
        }

        // Play/Pause functionality
        playButton.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                status.textContent = 'Paused';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    status.textContent = '🎵 Now Streaming';
                    isPlaying = true;
                }).catch(err => {
                    status.textContent = '❌ Stream unavailable';
                    console.error('Playback failed:', err);
                });
            }
        });

        // Volume control
        volumeSlider.addEventListener('input', function() {
            audio.volume = this.value / 100;
        });
        audio.volume = 0.7;

        // ============================================
        // 🚀 Initialize
        // ============================================
        window.addEventListener('load', () => {
            // Initialize IoT connection
            setTimeout(() => {
                console.log('📡 Initializing REAL IoT connection...');
                initializeIoT();
            }, 1000);
        });
    </script>
</body>
</html>
