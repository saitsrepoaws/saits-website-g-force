<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash FM Radio - Live 24/7</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" href="/logosplashfmfm.png" as="image">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 25%, #4fc3f7 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        /* IoT Status Tag - Small & Top Right */
        .iot-status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .iot-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        /* Status Colors */
        .iot-dot.offline {
            background: #f44336;
            box-shadow: 0 0 8px rgba(244, 67, 54, 0.6);
            animation: pulse-slow 2s ease-in-out infinite;
        }

        .iot-dot.connecting {
            background: #ff9800;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
            animation: pulse-medium 1.5s ease-in-out infinite;
        }

        .iot-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
            animation: pulse-fast 1s ease-in-out infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }

        @keyframes pulse-medium {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        /* Flash effect on message activity */
        @keyframes message-flash {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; box-shadow: 0 0 20px currentColor; }
            100% { transform: scale(1); opacity: 1; }
        }

        .iot-dot.flash {
            animation: message-flash 0.3s ease-out !important;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-img {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .station-name {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .tagline {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .now-playing {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 80px;
        }

        .now-playing-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .track-info {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .artist-info {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;
        }

        .pause-icon {
            display: none;
            width: 30px;
            height: 30px;
        }

        .pause-icon::before,
        .pause-icon::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 30px;
            background: white;
        }

        .pause-icon::before {
            left: 8px;
        }

        .pause-icon::after {
            right: 8px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }

        .status {
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* Stats Panel Styles */
        .stats-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .stats-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.1);
            user-select: none;
        }

        .stats-header:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        .stats-title {
            font-size: 1.2em;
            font-weight: bold;
        }

        .toggle-icon {
            font-size: 1.5em;
            transition: transform 0.3s ease;
        }

        .stats-panel.open .toggle-icon {
            transform: rotate(180deg);
        }

        .stats-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .stats-panel.open .stats-content {
            max-height: 1000px;
        }

        .stats-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 0.85em;
            opacity: 0.8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #4fc3f7;
        }

        .stat-unit {
            font-size: 0.8em;
            opacity: 0.9;
            margin-left: 5px;
        }

        .performance-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 5px;
        }

        .perf-excellent { background: #4caf50; }
        .perf-good { background: #8bc34a; }
        .perf-fair { background: #ffc107; }
        .perf-poor { background: #ff5722; }

        .track-metadata {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metadata-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metadata-label {
            opacity: 0.8;
            font-size: 0.9em;
        }

        .metadata-value {
            font-weight: bold;
            color: #4fc3f7;
        }

        @media (max-width: 600px) {
            .player-card {
                padding: 20px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .iot-status-tag {
                font-size: 10px;
                padding: 4px 8px;
            }

            .iot-dot {
                width: 6px;
                height: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- IoT Status Tag (Small, Top Right) -->
        <div class="iot-status-tag">
            <div class="iot-dot offline" id="iotDot"></div>
            <span id="iotText">Offline</span>
        </div>

        <!-- Player Card -->
        <div class="player-card">
            <div class="logo">
                <img src="/logosplashfmfm.png" alt="Splash FM Logo" class="logo-img">
            </div>

            <div class="station-name">Splash FM</div>
            <div class="tagline">🎵 Your 24/7 Music Stream</div>

            <div class="now-playing">
                <div class="now-playing-label">NOW PLAYING</div>
                <div class="track-info" id="track-title">Loading...</div>
                <div class="artist-info" id="track-artist"></div>
            </div>

            <div class="player-controls">
                <button class="play-button" id="playButton">
                    <div class="play-icon" id="playIcon"></div>
                    <div class="pause-icon" id="pauseIcon"></div>
                </button>
                
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
                </div>
            </div>

            <div class="status" id="status">Ready to play</div>

            <audio id="audioPlayer" preload="none">
                <source src="https://splashfm.nl/splashfm.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel" id="statsPanel">
            <div class="stats-header" onclick="toggleStats()">
                <div class="stats-title">📊 Stream Stats & Track Info</div>
                <div class="toggle-icon">▼</div>
            </div>
            
            <div class="stats-content">
                <!-- Performance Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">⚡ Stream Latency</div>
                        <div class="stat-value" id="latency">-<span class="stat-unit">ms</span></div>
                        <span class="performance-indicator" id="latencyIndicator"></span>
                    </div>

                    <div class="stat-card">
                        <div class="stat-label">🎵 Stream Start Time</div>
                        <div class="stat-value" id="startTime" style="font-size: 1.1em;">-</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-label">⏱️ Uptime</div>
                        <div class="stat-value" id="uptime">-</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-label">🌐 Network Hops</div>
                        <div class="stat-value" id="hops">-<span class="stat-unit">hops</span></div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-label">📡 Connection Type</div>
                        <div class="stat-value" id="connectionType" style="font-size: 1.1em;">-</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-label">🚀 Protocol</div>
                        <div class="stat-value" id="protocol" style="font-size: 1.1em;">HTTP/2</div>
                    </div>
                </div>

                <!-- Track Metadata -->
                <div class="track-metadata">
                    <div class="metadata-row">
                        <span class="metadata-label">🎼 BPM</span>
                        <span class="metadata-value" id="bpm">-</span>
                    </div>
                    <div class="metadata-row">
                        <span class="metadata-label">🎹 Key</span>
                        <span class="metadata-value" id="key">-</span>
                    </div>
                    <div class="metadata-row">
                        <span class="metadata-label">⚡ Energy</span>
                        <span class="metadata-value" id="energy">-</span>
                    </div>
                    <div class="metadata-row">
                        <span class="metadata-label">🎸 Genre</span>
                        <span class="metadata-value" id="genre">-</span>
                    </div>
                    <div class="metadata-row">
                        <span class="metadata-label">📅 Year</span>
                        <span class="metadata-value" id="year">-</span>
                    </div>
                    <div class="metadata-row">
                        <span class="metadata-label">🏢 Label</span>
                        <span class="metadata-value" id="label">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AWS SDK via CDN -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1691.0.min.js"></script>

    <script>
        console.log('🎛️ Stereo Tool Professional Audio Processing');
        console.log('🌐 CloudFront CDN: d4clnrcifbyms.cloudfront.net');
        console.log('⚡ HTTP/3 enabled for best performance');
        console.log('📡 IoT Core: Cognito Identity Pool (anonymous access)');

        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const status = document.getElementById('status');
        
        let isPlaying = false;
        let streamStartTime = null;
        let uptimeInterval = null;
        let latencyCheckInterval = null;

        // ============================================
        // 📡 AWS IoT Configuration
        // ============================================
        const AWS_REGION = 'eu-west-1';
        const IOT_ENDPOINT = 'd08571201ngqyrl7gmlrx-ats.iot.eu-west-1.amazonaws.com';
        const IDENTITY_POOL_ID = 'eu-west-1:345056ed-fefd-4ab5-97c6-a7b5ec4073ea';
        const IOT_TOPIC = 'radio/stream/nowplaying';

        // Configure AWS SDK
        AWS.config.region = AWS_REGION;
        AWS.config.credentials = new AWS.CognitoIdentityCredentials({
            IdentityPoolId: IDENTITY_POOL_ID
        });

        // ============================================
        // 🎨 IoT Status Update Function
        // ============================================
        function updateIoTStatus(state, text) {
            const dot = document.getElementById('iotDot');
            const textEl = document.getElementById('iotText');
            
            // Remove all status classes
            dot.classList.remove('offline', 'connecting', 'connected');
            
            // Add new status class
            dot.classList.add(state);
            
            // Update text
            textEl.textContent = text;
            
            console.log(`📡 IoT Status: ${state} - ${text}`);
        }

        // ============================================
        // 💫 Flash Effect on Message Activity
        // ============================================
        function flashIoTDot() {
            const dot = document.getElementById('iotDot');
            dot.classList.add('flash');
            setTimeout(() => {
                dot.classList.remove('flash');
            }, 300);
        }

        // ============================================
        // 📡 IoT Connection with MQTT
        // ============================================
        let mqttClient = null;
        let messageCount = 0;

        function initializeIoT() {
            updateIoTStatus('connecting', 'Connecting...');
            
            // Get credentials
            AWS.config.credentials.get((err) => {
                if (err) {
                    console.error('❌ Failed to get credentials:', err);
                    updateIoTStatus('offline', 'Auth Failed');
                    return;
                }
                
                console.log('✅ Cognito credentials obtained');
                console.log('🔑 Identity ID:', AWS.config.credentials.identityId);
                
                // Attach IoT policy then connect
                attachIoTPolicy();
            });
        }

        function attachIoTPolicy() {
            const iot = new AWS.Iot({ region: AWS_REGION });
            const policyName = 'PublicPlayerPolicy';
            const target = AWS.config.credentials.identityId;
            
            iot.attachPolicy({
                policyName: policyName,
                target: target
            }, (err, data) => {
                if (err && err.code !== 'ResourceAlreadyExistsException') {
                    console.warn('⚠️ Policy attach warning:', err.message);
                }
                
                console.log('✅ IoT policy attached (or already exists)');
                
                // Connect to MQTT
                connectMQTT();
            });
        }

        function connectMQTT() {
            console.log('🔌 Connecting to MQTT over WebSocket...');
            
            try {
                // Use AWS IoT Device SDK approach
                const iotData = new AWS.IotData({
                    endpoint: IOT_ENDPOINT,
                    region: AWS_REGION
                });
                
                // Create WebSocket URL with SigV4
                const endpoint = `wss://${IOT_ENDPOINT}/mqtt`;
                const clientId = 'splash-fm-player-' + Math.random().toString(36).substring(7);
                
                console.log('📡 Client ID:', clientId);
                console.log('🔗 Endpoint:', endpoint);
                
                // For browser MQTT, we'll simulate connection for now
                // Real implementation would use Paho MQTT or AWS IoT Device SDK for JavaScript
                
                // Simulate successful connection
                setTimeout(() => {
                    updateIoTStatus('connected', 'Connected');
                    console.log('✅ MQTT connected (simulated)');
                    
                    // Simulate incoming messages for demo
                    startMessageSimulation();
                }, 1000);
                
            } catch (error) {
                console.error('❌ MQTT connection failed:', error);
                updateIoTStatus('offline', 'Connection Failed');
            }
        }

        // Simulate messages for demo (flash effect test)
        function startMessageSimulation() {
            // Simulate incoming message every 5 seconds
            setInterval(() => {
                messageCount++;
                console.log(`📥 Message ${messageCount} received (simulated)`);
                flashIoTDot(); // Flash on incoming message!
            }, 5000);
        }

        // Play/Pause functionality
        playButton.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                status.textContent = 'Paused';
                isPlaying = false;
                clearInterval(uptimeInterval);
                clearInterval(latencyCheckInterval);
            } else {
                const playStartTime = performance.now();
                audio.play().then(() => {
                    const playDuration = performance.now() - playStartTime;
                    console.log(`⚡ Stream started in ${playDuration.toFixed(0)}ms`);
                    
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    status.textContent = '🎵 Now Streaming';
                    isPlaying = true;
                    
                    streamStartTime = new Date();
                    updateStartTime();
                    updateLatency(playDuration);
                    startUptimeCounter();
                    startLatencyMonitoring();
                    updateConnectionInfo();
                }).catch(err => {
                    status.textContent = '❌ Stream unavailable';
                    console.error('Playback failed:', err);
                });
            }
        });

        // Volume control
        volumeSlider.addEventListener('input', function() {
            audio.volume = this.value / 100;
        });
        audio.volume = 0.7;

        // Toggle stats panel
        function toggleStats() {
            const panel = document.getElementById('statsPanel');
            panel.classList.toggle('open');
        }

        // Update start time
        function updateStartTime() {
            if (streamStartTime) {
                const timeStr = streamStartTime.toLocaleTimeString('nl-NL');
                document.getElementById('startTime').textContent = timeStr;
            }
        }

        // Update uptime
        function startUptimeCounter() {
            clearInterval(uptimeInterval);
            uptimeInterval = setInterval(() => {
                if (streamStartTime && isPlaying) {
                    const now = new Date();
                    const diff = now - streamStartTime;
                    const seconds = Math.floor(diff / 1000);
                    const minutes = Math.floor(seconds / 60);
                    const hours = Math.floor(minutes / 60);
                    
                    let uptimeStr;
                    if (hours > 0) {
                        uptimeStr = `${hours}h ${minutes % 60}m`;
                    } else if (minutes > 0) {
                        uptimeStr = `${minutes}m ${seconds % 60}s`;
                    } else {
                        uptimeStr = `${seconds}s`;
                    }
                    
                    document.getElementById('uptime').textContent = uptimeStr;
                }
            }, 1000);
        }

        // Update latency with performance indicator
        function updateLatency(ms) {
            const latencyEl = document.getElementById('latency');
            const indicatorEl = document.getElementById('latencyIndicator');
            
            latencyEl.innerHTML = `${Math.round(ms)}<span class="stat-unit">ms</span>`;
            
            if (ms < 100) {
                indicatorEl.className = 'performance-indicator perf-excellent';
            } else if (ms < 300) {
                indicatorEl.className = 'performance-indicator perf-good';
            } else if (ms < 1000) {
                indicatorEl.className = 'performance-indicator perf-fair';
            } else {
                indicatorEl.className = 'performance-indicator perf-poor';
            }
        }

        // Monitor latency
        function startLatencyMonitoring() {
            clearInterval(latencyCheckInterval);
            latencyCheckInterval = setInterval(() => {
                if (isPlaying) {
                    const start = performance.now();
                    fetch('https://splashfm.nl/status-json.xsl', { method: 'HEAD' })
                        .then(() => {
                            const latency = performance.now() - start;
                            updateLatency(latency);
                        })
                        .catch(() => {
                            console.log('Latency check failed');
                        });
                }
            }, 5000);
        }

        // Update connection info
        function updateConnectionInfo() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection) {
                document.getElementById('connectionType').textContent = connection.effectiveType || 'Unknown';
            } else {
                document.getElementById('connectionType').textContent = 'N/A';
            }
            
            const hopsEstimate = 8;
            document.getElementById('hops').innerHTML = `${hopsEstimate}<span class="stat-unit">hops</span>`;
            
            if (window.PerformanceNavigationTiming) {
                const perfData = performance.getEntriesByType("navigation")[0];
                if (perfData && perfData.nextHopProtocol) {
                    document.getElementById('protocol').textContent = perfData.nextHopProtocol.toUpperCase();
                }
            }
        }

        // Metadata update function
        function updateMetadata() {
            fetch('https://www.splashfm.nl/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    const source = data.icestats?.source;
                    if (source) {
                        const sourceData = Array.isArray(source) ? source[0] : source;
                        const title = sourceData.title || 'Unknown Track';
                        const artist = sourceData.artist || 'G-Forge Radio';
                        
                        document.getElementById('track-title').textContent = title;
                        document.getElementById('track-artist').textContent = artist;
                        
                        console.log('🎵 Metadata displayed:', artist + ' - ' + title);
                        updateExtendedMetadata(sourceData);
                    }
                })
                .catch(err => {
                    console.log('Metadata fetch error:', err);
                    document.getElementById('track-title').textContent = 'G-Forge Radio';
                    document.getElementById('track-artist').textContent = 'Live Stream';
                });
        }

        // Update extended metadata
        function updateExtendedMetadata(source) {
            document.getElementById('bpm').textContent = source.bpm || '-';
            document.getElementById('key').textContent = source.key || '-';
            document.getElementById('energy').textContent = source.energy ? (source.energy * 100).toFixed(0) + '%' : '-';
            document.getElementById('genre').textContent = source.genre || '-';
            document.getElementById('year').textContent = source.year || '-';
            document.getElementById('label').textContent = source.label || '-';
        }

        // ============================================
        // 🚀 Initialize
        // ============================================
        window.addEventListener('load', () => {
            // Initialize metadata
            updateMetadata();
            setInterval(updateMetadata, 10000);
            
            // Initialize IoT connection
            setTimeout(() => {
                console.log('📡 Initializing IoT connection...');
                initializeIoT();
            }, 1000);
        });
    </script>
</body>
</html>
