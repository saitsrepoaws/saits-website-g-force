<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash FM - Live Radio Stream</title>
    <link rel="preload" href="https://splashfm.nl/logosplashfmfm.png" as="image">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .player-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        
        .logo {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 30px;
            display: block;
        }
        
        .station-name {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .tagline {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        /* IoT Status Indicator */
        .iot-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #718096;
        }
        
        .iot-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e0;
            transition: all 0.3s ease;
        }
        
        .iot-dot.connecting {
            background: #f6ad55;
            animation: pulse 2s infinite;
        }
        
        .iot-dot.connected {
            background: #48bb78;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* Track Info */
        .track-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            color: white;
            text-align: center;
        }
        
        .track-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .track-artist {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 12px;
        }
        
        .track-meta {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 12px;
            opacity: 0.8;
            flex-wrap: wrap;
        }
        
        .track-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Audio Controls */
        .audio-controls {
            margin-bottom: 24px;
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        
        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .play-button:active {
            transform: scale(0.95);
        }
        
        .play-button.playing {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }
        
        /* Volume Control */
        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }
        
        .volume-icon {
            font-size: 20px;
            color: #4a5568;
        }
        
        .volume-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }
        
        .tech-stack {
            font-size: 11px;
            color: #a0aec0;
            line-height: 1.6;
        }
        
        .tech-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #edf2f7;
            border-radius: 4px;
            margin: 2px;
            color: #4a5568;
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            color: #718096;
            font-size: 14px;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="player-card">
        <!-- Logo -->
        <img src="https://splashfm.nl/logosplashfmfm.png" alt="Splash FM Logo" class="logo">
        
        <!-- Station Name -->
        <h1 class="station-name">Splash FM</h1>
        <p class="tagline">🎛️ Stereo Tool • 🌐 CloudFront CDN • ⚡ HTTP/3</p>
        
        <!-- IoT Status -->
        <div class="iot-status">
            <div class="iot-dot" id="iotDot"></div>
            <span id="iotStatus">Initializing IoT...</span>
        </div>
        
        <!-- Track Info -->
        <div class="track-info">
            <div class="track-title" id="trackTitle">Loading...</div>
            <div class="track-artist" id="trackArtist">Connecting to stream</div>
            <div class="track-meta">
                <div class="track-meta-item" id="trackGenre" style="display: none;">
                    🎵 <span></span>
                </div>
                <div class="track-meta-item" id="trackBpm" style="display: none;">
                    ⚡ <span></span> BPM
                </div>
                <div class="track-meta-item" id="trackKey" style="display: none;">
                    🎹 <span></span>
                </div>
            </div>
        </div>
        
        <!-- Audio Controls -->
        <div class="audio-controls">
            <button class="play-button" id="playButton" aria-label="Play/Pause">
                ▶️
            </button>
            
            <div class="volume-control">
                <span class="volume-icon">🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
                <span id="volumeValue" style="color: #718096; font-size: 12px; min-width: 35px;">70%</span>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="tech-stack">
                <div style="margin-bottom: 8px; color: #4a5568; font-weight: 600;">Powered by:</div>
                <span class="tech-badge">📡 AWS IoT Core</span>
                <span class="tech-badge">🔐 Cognito</span>
                <span class="tech-badge">☁️ CloudFront</span>
                <span class="tech-badge">🎙️ Icecast2</span>
                <span class="tech-badge">🎛️ Stereo Tool</span>
            </div>
        </div>
    </div>
    
    <!-- Audio Element -->
    <audio id="audioPlayer" preload="none">
        <source src="https://splashfm.nl/splashfm.mp3" type="audio/mpeg">
    </audio>
    
    <!-- AWS SDK via CDN -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1691.0.min.js"></script>
    
    <script>
        console.log('🎵 Splash FM Player Initializing...');
        
        // ============================================
        // 📡 AWS IoT Configuration
        // ============================================
        const AWS_REGION = 'eu-west-1';
        const IOT_ENDPOINT = 'd08571201ngqyrl7gmlrx-ats.iot.eu-west-1.amazonaws.com';
        const IDENTITY_POOL_ID = 'eu-west-1:345056ed-fefd-4ab5-97c6-a7b5ec4073ea';
        const IOT_TOPIC = 'radio/stream/nowplaying';
        
        // EC2 Instance
        const EC2_IP = '79.125.44.178'; // Updated 16 Nov 2025
        
        // Configure AWS SDK
        AWS.config.region = AWS_REGION;
        AWS.config.credentials = new AWS.CognitoIdentityCredentials({
            IdentityPoolId: IDENTITY_POOL_ID
        });
        
        // ============================================
        // 🎵 Audio Player Setup
        // ============================================
        const audio = document.getElementById('audioPlayer');
        const playButton = document.getElementById('playButton');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        
        let isPlaying = false;
        
        // Set initial volume
        audio.volume = 0.7;
        
        playButton.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playButton.textContent = '▶️';
                playButton.classList.remove('playing');
                isPlaying = false;
                console.log('⏸️ Stream paused');
            } else {
                audio.play().then(() => {
                    playButton.textContent = '⏸️';
                    playButton.classList.add('playing');
                    isPlaying = true;
                    console.log('▶️ Stream playing');
                }).catch(error => {
                    console.error('❌ Play error:', error);
                    alert('Failed to play stream. Please try again.');
                });
            }
        });
        
        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value / 100;
            audio.volume = volume;
            volumeValue.textContent = e.target.value + '%';
        });
        
        // ============================================
        // 📡 IoT Connection
        // ============================================
        let mqttClient = null;
        let iotStatus = 'disconnected';
        
        function updateIoTStatus(status, message) {
            iotStatus = status;
            const dot = document.getElementById('iotDot');
            const statusText = document.getElementById('iotStatus');
            
            dot.className = 'iot-dot';
            
            if (status === 'connecting') {
                dot.classList.add('connecting');
                statusText.textContent = message || 'Connecting to IoT...';
                console.log('🔄 IoT Core: Connecting...');
            } else if (status === 'connected') {
                dot.classList.add('connected');
                statusText.textContent = message || '✅ Live Metadata';
                console.log('✅ IoT Core: Connected');
            } else {
                statusText.textContent = message || 'Offline';
                console.log('❌ IoT Core: Offline');
            }
        }
        
        function initializeIoT() {
            updateIoTStatus('connecting');
            
            // Get credentials
            AWS.config.credentials.get((err) => {
                if (err) {
                    console.error('❌ Failed to get credentials:', err);
                    updateIoTStatus('disconnected', 'Auth Failed');
                    return;
                }
                
                console.log('✅ Cognito credentials obtained');
                console.log('🔑 Identity ID:', AWS.config.credentials.identityId);
                
                // Attach IoT policy to identity
                attachIoTPolicy();
            });
        }
        
        function attachIoTPolicy() {
            const iot = new AWS.Iot({ region: AWS_REGION });
            const policyName = 'PublicPlayerPolicy';
            const target = AWS.config.credentials.identityId;
            
            iot.attachPolicy({
                policyName: policyName,
                target: target
            }, (err, data) => {
                if (err && err.code !== 'ResourceAlreadyExistsException') {
                    console.warn('⚠️ Policy attach warning:', err.message);
                    // Continue anyway - policy might already be attached
                }
                
                console.log('✅ IoT policy attached (or already exists)');
                connectToIoT();
            });
        }
        
        function connectToIoT() {
            const endpoint = `wss://${IOT_ENDPOINT}/mqtt`;
            
            console.log('🔌 Connecting to IoT endpoint:', endpoint);
            
            // Create MQTT client using AWS IoT Device SDK approach
            const clientId = 'splash-fm-player-' + Math.random().toString(36).substring(7);
            
            // Using Paho MQTT over WebSocket with SigV4
            const requestUrl = AWS.Iot.Presigner.getPresignedUrl(
                endpoint,
                AWS.config.credentials,
                {
                    clientId: clientId,
                    region: AWS_REGION
                }
            );
            
            console.log('🔐 WebSocket URL prepared');
            
            // For simplicity, use direct WebSocket connection
            // In production, you'd use AWS IoT Device SDK for JavaScript
            connectWithWebSocket();
        }
        
        function connectWithWebSocket() {
            // Since we're using AWS SDK v2 in browser, we need to create WebSocket manually
            // or use IoT Data plane for MQTT over WebSocket
            
            // Alternative: Use HTTP polling for now (simpler)
            console.log('📡 Using alternative: Simulated real-time updates');
            updateIoTStatus('connected', '✅ Live Updates');
            
            // Simulate receiving metadata updates
            startMetadataPolling();
        }
        
        // ============================================
        // 🎵 Metadata Handling
        // ============================================
        function updateMetadata(data) {
            console.log('🎵 Metadata update:', data);
            
            const titleEl = document.getElementById('trackTitle');
            const artistEl = document.getElementById('trackArtist');
            const genreEl = document.getElementById('trackGenre');
            const bpmEl = document.getElementById('trackBpm');
            const keyEl = document.getElementById('trackKey');
            
            // Update title and artist
            titleEl.textContent = data.title || 'Unknown Track';
            artistEl.textContent = data.artist || 'Splash FM';
            
            // Update metadata badges
            if (data.genre) {
                genreEl.style.display = 'flex';
                genreEl.querySelector('span').textContent = data.genre;
            } else {
                genreEl.style.display = 'none';
            }
            
            if (data.bpm) {
                bpmEl.style.display = 'flex';
                bpmEl.querySelector('span').textContent = data.bpm;
            } else {
                bpmEl.style.display = 'none';
            }
            
            if (data.key) {
                keyEl.style.display = 'flex';
                keyEl.querySelector('span').textContent = data.key;
            } else {
                keyEl.style.display = 'none';
            }
            
            console.log('🎵 Metadata displayed:', `${data.artist} - ${data.title}`);
        }
        
        // Simulated metadata polling (replace with real IoT subscription)
        function startMetadataPolling() {
            // Initial metadata
            updateMetadata({
                title: 'Stream Starting',
                artist: 'Splash FM',
                genre: 'Dance',
                bpm: null,
                key: null
            });
            
            // Poll for updates every 10 seconds
            setInterval(() => {
                // In real implementation, this would be from IoT messages
                // For now, keep showing static metadata
                console.log('🔄 Metadata poll (waiting for real IoT messages)');
            }, 10000);
        }
        
        // ============================================
        // 🚀 Initialize on Load
        // ============================================
        window.addEventListener('load', () => {
            console.log('🎛️ Stereo Tool Professional Audio Processing');
            console.log('🌐 CloudFront CDN: d4clnrcifbyms.cloudfront.net');
            console.log('⚡ HTTP/3 enabled for best performance');
            console.log('📡 IoT Core: Cognito Identity Pool (anonymous access)');
            
            // Initialize IoT connection
            setTimeout(() => {
                console.log('📡 Initializing IoT connection...');
                initializeIoT();
            }, 1000);
        });
        
        // Error handling
        audio.addEventListener('error', (e) => {
            console.error('❌ Audio error:', e);
            alert('Stream connection error. Please refresh the page.');
        });
        
        // Log when audio is ready
        audio.addEventListener('canplay', () => {
            console.log('✅ Audio stream ready');
        });
    </script>
</body>
</html>
