# AWS CodeDeploy AppSpec - G-Forge IoT Radio Platform
# Version: 1.0
# Date: 16 November 2025

version: 0.0
os: linux

# Files to deploy
files:
  # Complete repo to /opt/g-forge-iot for CodeDeploy
  - source: /
    destination: /opt/g-forge-iot/

# Deployment hooks
hooks:
  # Before installation
  ApplicationStop:
    - location: scripts/deploy/stop-services.sh
      timeout: 300
      runas: root
  
  # Before install
  BeforeInstall:
    - location: scripts/deploy/backup-current.sh
      timeout: 300
      runas: root
    - location: scripts/deploy/install-dependencies.sh
      timeout: 1800
      runas: root
  
  # After install
  AfterInstall:
    - location: scripts/deploy/set-permissions.sh
      timeout: 300
      runas: root
    - location: scripts/deploy/update-configs.sh
      timeout: 300
      runas: root
  
  # Application start
  ApplicationStart:
    - location: scripts/deploy/start-services.sh
      timeout: 300
      runas: root
    - location: pipeline/scripts/save-deployment-parameters.sh
      timeout: 60
      runas: root
  
  # Validation
  ValidateService:
    - location: scripts/deploy/validate-deployment.sh
      timeout: 600
      runas: root
