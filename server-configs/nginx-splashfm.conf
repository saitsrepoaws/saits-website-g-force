server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name 46.137.184.91 radio.g-forge.com;
    
    # Root directory
    root /var/www/radio;
    index index.html;
    
    # Homepage
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Icecast status (JSON)
    location /status-json.xsl {
        proxy_pass http://localhost:8000/status-json.xsl;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Icecast stream (MP3)
    location /stream.mp3 {
        proxy_pass http://localhost:8000/stream.mp3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        tcp_nodelay on;
        
        # CORS headers for stream
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Range';
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Admin interface (optional, password protected)
    location /admin {
        proxy_pass http://localhost:8000/admin;
        auth_basic "Icecast Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    # Stereo Tool Web Interface
    location /stereotool {
        rewrite ^/stereotool/(.*) /$1 break;
        proxy_pass http://localhost:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin *;
    }

}

# Stereo Tool Web Interface (simple proxy)
server {
    listen 9002;
    
    location / {
        proxy_pass http://localhost:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
}
