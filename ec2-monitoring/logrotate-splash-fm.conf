# Splash FM Log Rotation Config
# Install to: /etc/logrotate.d/splash-fm

# Liquidsoap logs
/tmp/liquidsoap.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    postrotate
        # No need to restart, Liquidsoap handles it
    endscript
}

# Stereo Tool logs
/tmp/stereotool.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}

# Nginx logs
/var/log/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
    endscript
}

# Icecast logs
/var/log/icecast2/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 icecast2 icecast
    sharedscripts
    postrotate
        systemctl reload icecast2 > /dev/null 2>&1 || true
    endscript
}

# Splash monitoring logs
/var/log/splash-*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
